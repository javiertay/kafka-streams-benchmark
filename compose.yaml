x-kafka-environment: &kafka-environment
  KAFKA_BROKER_COUNT: ${KAFKA_BROKER_COUNT:-3}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

x-kafka-command: &kafka-command
  - /bin/bash
  - -ec
  - |
    case "$${KAFKA_BROKER_COUNT}" in
      1) voters="1@kafka-1:29093" ;;
      2) voters="1@kafka-1:29093,2@kafka-2:29093" ;;
      3) voters="1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093" ;;
      *) echo "KAFKA_BROKER_COUNT must be 1, 2, or 3" >&2; exit 2 ;;
    esac
    if [ "$${KAFKA_NODE_ID}" -gt "$${KAFKA_BROKER_COUNT}" ]; then
      echo "Kafka broker $${KAFKA_NODE_ID} disabled by KAFKA_BROKER_COUNT=$${KAFKA_BROKER_COUNT}"
      exec sleep infinity
    fi
    export KAFKA_CONTROLLER_QUORUM_VOTERS="$${voters}"
    export KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR="$${KAFKA_BROKER_COUNT}"
    export KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR="$${KAFKA_BROKER_COUNT}"
    export KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR="$${KAFKA_BROKER_COUNT}"
    if [ "$${KAFKA_BROKER_COUNT}" -eq 1 ]; then min_isr=1; else min_isr=2; fi
    export KAFKA_MIN_INSYNC_REPLICAS="$${min_isr}"
    export KAFKA_TRANSACTION_STATE_LOG_MIN_ISR="$${min_isr}"
    export KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR="$${min_isr}"
    exec /etc/kafka/docker/run

x-worker: &worker
  image: kafka-streams-benchmark:local
  pull_policy: never
  depends_on:
    kafka-1:
      condition: service_healthy
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092
    KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    KAFKA_BROKER_COUNT: ${KAFKA_BROKER_COUNT:-3}
    BENCHMARK_PROCESSING_MODE: ${BENCHMARK_PROCESSING_MODE:-metadata}
    BENCHMARK_OUTPUT_INTERVAL_SECONDS: ${BENCHMARK_OUTPUT_INTERVAL_SECONDS:-5}
    BENCHMARK_WORKER_MODE: "true"

services:
  kafka-1:
    image: apache/kafka:4.1.2
    hostname: kafka-1
    command: *kafka-command
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092,PLAINTEXT_HOST://localhost:9092
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka-2:
    image: apache/kafka:4.1.2
    hostname: kafka-2
    command: *kafka-command
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092,PLAINTEXT_HOST://localhost:9093

  kafka-3:
    image: apache/kafka:4.1.2
    hostname: kafka-3
    command: *kafka-command
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092,PLAINTEXT_HOST://localhost:9094

  benchmark:
    build: .
    image: kafka-streams-benchmark:local
    ports:
      - "8080:8080"
    depends_on:
      kafka-1:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_BROKER_COUNT: ${KAFKA_BROKER_COUNT:-3}
      BENCHMARK_DURATION_SECONDS: ${BENCHMARK_DURATION_SECONDS:-300}
      BENCHMARK_OUTPUT_INTERVAL_SECONDS: ${BENCHMARK_OUTPUT_INTERVAL_SECONDS:-5}
      BENCHMARK_MIN_INPUTS_PER_SECOND: ${BENCHMARK_MIN_INPUTS_PER_SECOND:-10}
      BENCHMARK_MAX_INPUTS_PER_SECOND: ${BENCHMARK_MAX_INPUTS_PER_SECOND:-500}
      BENCHMARK_DUPLICATE_PERCENT: ${BENCHMARK_DUPLICATE_PERCENT:-20}
      BENCHMARK_WORKLOAD_SEED: ${BENCHMARK_WORKLOAD_SEED:-42}
      BENCHMARK_PARTITIONS: 1,3,6
      BENCHMARK_PAYLOAD_BYTES: "256"
      BENCHMARK_PROCESSING_MODE: ${BENCHMARK_PROCESSING_MODE:-metadata}
      BENCHMARK_SERVICE_INSTANCES: 1,3
      BENCHMARK_WORKER_URLS: http://benchmark-worker-1:8080,http://benchmark-worker-2:8080,http://benchmark-worker-3:8080
      BENCHMARK_WARMUP_DURATION_SECONDS: ${BENCHMARK_WARMUP_DURATION_SECONDS:-10}
      BENCHMARK_ITERATIONS: "2"
      BENCHMARK_REPLICATION_FACTOR: ${KAFKA_BROKER_COUNT:-3}
      BENCHMARK_TIMEOUT_SECONDS: "300"

  benchmark-worker-1:
    <<: *worker

  benchmark-worker-2:
    <<: *worker

  benchmark-worker-3:
    <<: *worker

  benchmark-worker-4:
    <<: *worker

  benchmark-worker-5:
    <<: *worker

  benchmark-worker-6:
    <<: *worker
