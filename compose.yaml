x-worker: &worker
  image: kafka-streams-benchmark:local
  pull_policy: never
  depends_on:
    kafka:
      condition: service_healthy
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    BENCHMARK_WORKER_MODE: "true"

services:
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  benchmark:
    build: .
    image: kafka-streams-benchmark:local
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      BENCHMARK_INPUT_RATES: 100000,1000000
      BENCHMARK_MEASUREMENT_SECONDS: "10"
      BENCHMARK_PARTITIONS: 1,3,6
      BENCHMARK_PAYLOAD_BYTES: "256"
      BENCHMARK_SERVICE_INSTANCES: 1,3,6
      BENCHMARK_WORKER_URLS: http://benchmark-worker-1:8080,http://benchmark-worker-2:8080,http://benchmark-worker-3:8080,http://benchmark-worker-4:8080,http://benchmark-worker-5:8080,http://benchmark-worker-6:8080
      BENCHMARK_WARMUP_SECONDS: "1"
      BENCHMARK_ITERATIONS: "1"
      BENCHMARK_REPLICATION_FACTOR: "1"
      BENCHMARK_TIMEOUT_SECONDS: "300"

  benchmark-worker-1:
    <<: *worker

  benchmark-worker-2:
    <<: *worker

  benchmark-worker-3:
    <<: *worker

  benchmark-worker-4:
    <<: *worker

  benchmark-worker-5:
    <<: *worker

  benchmark-worker-6:
    <<: *worker
